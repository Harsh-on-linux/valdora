<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Space Shooter — Tactical cockpit command with real-time HUD, ship systems and weapons management.">
  <title>Space Shooter — Cockpit Command</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/menu.css">
  <link rel="stylesheet" href="styles/game.css">
</head>
<body data-active-screen="landing">
  <div id="app">
    <!-- Background Canvas (Starfield / Deep Space) -->
    <canvas id="starfield-canvas"></canvas>

    <!-- Gameplay Canvas (Ship, Bullets, Enemies, Particles) -->
    <canvas id="game-canvas"></canvas>

    <!-- CRT Scanline & Vignette Overlay -->
    <div class="scanlines-overlay"></div>

    <!-- UI Overlay Root — screens mount here via ScreenManager -->
    <div id="ui-root" data-active-screen="landing"></div>
  </div>

  <!-- HUD Controller Script (Interactive Logic) -->
  <script type="module" src="scripts/hud-controller.js"></script>

  <!-- Entry Script -->
  <script type="module" src="scripts/main.js?v=2.0.0"></script>
</body>
</html>
